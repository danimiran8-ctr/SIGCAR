<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pagos — SIGCAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f4f6f9; margin: 0; }
        .sidebar { width: 260px; min-height: 100vh; background: #1a1a2e; position: fixed; top: 0; left: 0; z-index: 100; }
        .sidebar-brand { padding: 22px 20px; border-bottom: 1px solid #2a2a4e; }
        .sidebar-brand .logo { font-size: 1.3rem; font-weight: 800; color: #fff; }
        .sidebar-brand .logo span { color: #f5c518; }
        .sidebar-brand small { color: #888; font-size: 0.72rem; }
        .menu-label { padding: 8px 20px; font-size: 0.7rem; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 1px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 11px 20px; color: #aaa; text-decoration: none; font-size: 0.9rem; transition: all 0.2s; border-left: 3px solid transparent; }
        .menu-item:hover, .menu-item.active { background: rgba(245,197,24,0.08); color: #f5c518; border-left-color: #f5c518; }
        .menu-item i { font-size: 1.1rem; width: 20px; }
        .main-content { margin-left: 260px; }
        .topbar { background: #fff; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 99; }
        .topbar-title { font-weight: 700; color: #1a1a2e; font-size: 1.1rem; }
        .card-table { background: #fff; border-radius: 16px; padding: 24px; border: 1px solid #f0f0f0; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .table th { font-size: 0.78rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #f0f0f0; padding: 12px 16px; }
        .table td { font-size: 0.9rem; vertical-align: middle; padding: 12px 16px; }
        .kpi-card { background: #fff; border-radius: 16px; padding: 22px; border: 1px solid #f0f0f0; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .kpi-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 14px; }
        .kpi-number { font-size: 1.7rem; font-weight: 800; color: #1a1a2e; }
        .kpi-label { color: #888; font-size: 0.85rem; margin-top: 2px; }
        .form-select-sm { border: 1.5px solid #e0e0e0; border-radius: 10px; padding: 9px 14px; font-size: 0.88rem; }
    </style>
</head>
<body>
 
<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-brand">
        <div class="logo"><i class="bi bi-car-front-fill me-2"></i><span>SIGCAR</span></div>
        <small id="labelRol">Panel</small>
    </div>
    <div style="padding: 16px 0;" id="sidebarMenu"></div>
</div>
 
<!-- MAIN -->
<div class="main-content">
    <div class="topbar">
        <div class="topbar-title">
            <i class="bi bi-credit-card me-2" style="color:#f5c518;"></i>Gestión de Pagos
        </div>
        <div style="font-size:0.85rem;color:#888;">Administrador y Agente</div>
    </div>
 
    <div class="p-4">
 
        <!-- KPIs -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="kpi-card">
                    <div class="kpi-icon" style="background:#e8f5e9;">
                        <i class="bi bi-cash-coin" style="color:#4caf50;"></i>
                    </div>
                    <div class="kpi-number" id="kpiIngresosMes">
                        <div class="spinner-border spinner-border-sm text-success"></div>
                    </div>
                    <div class="kpi-label">Ingresos del mes (COP)</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="kpi-card">
                    <div class="kpi-icon" style="background:#e3f2fd;">
                        <i class="bi bi-receipt" style="color:#2196f3;"></i>
                    </div>
                    <div class="kpi-number" id="kpiTotalPagos">
                        <div class="spinner-border spinner-border-sm text-primary"></div>
                    </div>
                    <div class="kpi-label">Total pagos registrados</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="kpi-card">
                    <div class="kpi-icon" style="background:#fff8e1;">
                        <i class="bi bi-bank" style="color:#f5c518;"></i>
                    </div>
                    <div class="kpi-number" id="kpiTransferencias">
                        <div class="spinner-border spinner-border-sm text-warning"></div>
                    </div>
                    <div class="kpi-label">Pagos por transferencia</div>
                </div>
            </div>
        </div>
 
        <!-- Tabla -->
        <div class="card-table">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h6 class="fw-700 mb-0" style="color:#1a1a2e;">
                    <i class="bi bi-list-check me-2" style="color:#f5c518;"></i>Historial de pagos
                </h6>
                <select class="form-select-sm" id="filtroMetodo" onchange="filtrar()">
                    <option value="">Todos los métodos</option>
                    <option value="EFECTIVO">Efectivo</option>
                    <option value="TRANSFERENCIA">Transferencia</option>
                </select>
            </div>
 
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>N° Pago</th>
                            <th>Cliente</th>
                            <th>Vehículo</th>
                            <th>Monto</th>
                            <th>Método</th>
                            <th>Fecha pago</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        <tr>
                            <td colspan="8" class="text-center text-muted py-5">
                                <div class="spinner-border spinner-border-sm text-warning me-2"></div>
                                Cargando pagos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <small class="text-muted" id="totalRegistros"></small>
        </div>
    </div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let todosPagos = [];
 
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }
 
    const token = getCookie('jwt_token');
    if (!token) window.location.href = '/login';
 
    let rolActual = '';
    try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        rolActual = payload.rol || '';
        if (rolActual === 'CLIENTE') window.location.href = '/dashboard/cliente';
    } catch (e) {
        window.location.href = '/login';
    }
 
    // ── SIDEBAR ──────────────────────────────────────────
    function construirSidebar() {
        const labelRol = document.getElementById('labelRol');
        let menu = '';
 
        if (rolActual === 'ADMINISTRADOR') {
            labelRol.textContent = 'Panel Administrador';
            menu = `
                <div class="menu-label">Principal</div>
                <a href="/dashboard/admin" class="menu-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <div class="menu-label">Gestión</div>
                <a href="/usuarios/lista" class="menu-item"><i class="bi bi-people"></i> Usuarios</a>
                <a href="/vehiculos/lista" class="menu-item"><i class="bi bi-car-front"></i> Vehículos</a>
                <a href="/reservas/lista" class="menu-item"><i class="bi bi-calendar-check"></i> Reservas</a>
                <a href="/pagos/lista" class="menu-item active"><i class="bi bi-credit-card"></i> Pagos</a>
                <a href="/mantenimientos/lista" class="menu-item"><i class="bi bi-tools"></i> Mantenimientos</a>
                <div class="menu-label">Reportes</div>
                <a href="/reportes/lista" class="menu-item"><i class="bi bi-bar-chart"></i> Reportes</a>
                <div class="menu-label">Cuenta</div>
                <a href="/logout" class="menu-item"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>`;
        } else if (rolActual === 'AGENTE') {
            labelRol.textContent = 'Panel Agente';
            menu = `
                <div class="menu-label">Principal</div>
                <a href="/dashboard/agente" class="menu-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <div class="menu-label">Gestión</div>
                <a href="/vehiculos/lista" class="menu-item"><i class="bi bi-car-front"></i> Vehículos</a>
                <a href="/reservas/lista" class="menu-item"><i class="bi bi-calendar-check"></i> Reservas</a>
                <a href="/pagos/lista" class="menu-item active"><i class="bi bi-credit-card"></i> Pagos</a>
                <div class="menu-label">Cuenta</div>
                <a href="/logout" class="menu-item"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>`;
        }
 
        document.getElementById('sidebarMenu').innerHTML = menu;
    }
 
    // ── CARGAR KPIs ──────────────────────────────────────
    async function cargarKpis() {
        try {
            const res = await fetch('/api/pagos/ingresos/mes', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                const data = await res.json();
                document.getElementById('kpiIngresosMes').textContent =
                    '$' + (data.ingresos || 0).toLocaleString('es-CO');
            }
        } catch (e) {
            document.getElementById('kpiIngresosMes').textContent = '—';
        }
    }
 
    // ── CARGAR PAGOS ─────────────────────────────────────
    async function cargarPagos() {
        try {
            const res = await fetch('/api/pagos', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!res.ok) { window.location.href = '/login'; return; }
 
            todosPagos = await res.json();
 
            // KPIs
            document.getElementById('kpiTotalPagos').textContent = todosPagos.length;
            const transferencias = todosPagos.filter(p =>
                p.metodoPago === 'TRANSFERENCIA').length;
            document.getElementById('kpiTransferencias').textContent = transferencias;
 
            renderTabla(todosPagos);
 
        } catch (e) {
            document.getElementById('cuerpoTabla').innerHTML =
                `<tr><td colspan="8" class="text-center text-danger py-4">
                Error al cargar pagos</td></tr>`;
        }
    }
 
    function renderTabla(pagos) {
        const tbody = document.getElementById('cuerpoTabla');
        document.getElementById('totalRegistros').textContent =
            `Total: ${pagos.length} pago(s)`;
 
        if (pagos.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-5">
                <i class="bi bi-receipt fs-2 d-block mb-2"></i>
                No hay pagos registrados aún</td></tr>`;
            return;
        }
 
        tbody.innerHTML = pagos.map(p => {
            const fecha = p.fechaPago
                ? new Date(p.fechaPago).toLocaleDateString('es-CO',
                    { day:'2-digit', month:'2-digit', year:'numeric',
                      hour:'2-digit', minute:'2-digit' })
                : '—';
 
            const metodoBadge = p.metodoPago === 'EFECTIVO'
                ? '<span style="background:#e8f5e9;color:#2e7d32;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:600;">💵 Efectivo</span>'
                : '<span style="background:#e3f2fd;color:#1565c0;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:600;">🏦 Transferencia</span>';
 
            return `
            <tr>
                <td><strong style="color:#f5c518;">${p.numeroPago || '—'}</strong></td>
                <td>${p.nombreCliente || p.idCliente}</td>
                <td>
                    <strong>${p.placaVehiculo || '—'}</strong>
                    <small class="d-block text-muted">${p.marcaModelo || ''}</small>
                </td>
                <td><strong>$${(p.monto || 0).toLocaleString('es-CO')}</strong></td>
                <td>${metodoBadge}</td>
                <td><small>${fecha}</small></td>
                <td><span style="background:#e8f5e9;color:#2e7d32;padding:3px 10px;
                    border-radius:20px;font-size:0.75rem;font-weight:600;">
                    ✓ ${p.estado}</span></td>
                <td>
                    <button class="btn btn-sm btn-outline-warning"
                        title="Descargar factura"
                        onclick="descargarFactura('${p.idReserva}')">
                        <i class="bi bi-receipt"></i>
                    </button>
                </td>
            </tr>`;
        }).join('');
    }
 
    function filtrar() {
        const metodo = document.getElementById('filtroMetodo').value;
        const filtrados = metodo === ''
            ? todosPagos
            : todosPagos.filter(p => p.metodoPago === metodo);
        renderTabla(filtrados);
    }
 
    async function descargarFactura(idReserva) {
        try {
            const res = await fetch(`/api/pagos/reserva/${idReserva}/factura`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `factura-${idReserva}.pdf`;
                a.click();
                window.URL.revokeObjectURL(url);
            } else {
                alert('Error al descargar la factura.');
            }
        } catch (e) { alert('Error de conexión'); }
    }
 
    document.addEventListener('DOMContentLoaded', () => {
        construirSidebar();
        cargarKpis();
        cargarPagos();
    });
</script>
</body>
</html>
