<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — SIGCAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 45px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand-logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a1a2e;
        }
        .brand-logo span { color: #f5c518; }
        .brand-sub { color: #888; font-size: 0.82rem; }
        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #444;
        }
        .form-control {
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #f5c518;
            box-shadow: 0 0 0 3px rgba(245,197,24,0.15);
        }
        .input-group-text {
            border: 1.5px solid #e0e0e0;
            border-right: none;
            background: #f8f9fa;
            border-radius: 10px 0 0 10px;
            color: #888;
        }
        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }
        .btn-ingresar {
            background: #f5c518;
            color: #1a1a2e;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 1rem;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-ingresar:hover {
            background: #e0b015;
            transform: translateY(-1px);
        }
        .divider {
            text-align: center;
            color: #bbb;
            font-size: 0.85rem;
            margin: 18px 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: #e0e0e0;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .btn-volver {
            border: 2px solid #1a1a2e;
            color: #1a1a2e;
            font-weight: 600;
            border-radius: 10px;
            padding: 11px;
            width: 100%;
            background: transparent;
            transition: all 0.2s;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        .btn-volver:hover {
            background: #1a1a2e;
            color: #f5c518;
        }
        .alert-error {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            color: #c53030;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.88rem;
            margin-bottom: 16px;
        }
        .link-registro {
            color: #f5c518;
            font-weight: 600;
            text-decoration: none;
        }
        .link-registro:hover { color: #e0b015; }
    </style>
</head>
<body>
    <div class="login-card">

        <!-- Logo -->
        <div class="text-center mb-4">
            <div class="brand-logo">
                <i class="bi bi-car-front-fill me-2"></i><span>SIGCAR</span>
            </div>
            <p class="brand-sub mt-1">RentCar Express S.A.S.</p>
        </div>

        <h5 class="fw-700 mb-1" style="color:#1a1a2e;">Iniciar Sesión</h5>
        <p class="text-muted mb-4" style="font-size:0.88rem;">Ingresa tus credenciales para continuar</p>

        <!-- Error -->
        <div class="alert-error" th:if="${error}" th:text="${error}"></div>

        <!-- Formulario -->
        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="correo" class="form-control"
                           placeholder="correo@ejemplo.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control"
                           placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-ingresar">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
            </button>
        </form>

        <div class="divider">o</div>

        <a href="/" class="btn-volver">
            <i class="bi bi-arrow-left me-2"></i>Volver al inicio
        </a>

        <p class="text-center mt-4 mb-0" style="font-size:0.88rem; color:#888;">
            ¿No tienes cuenta?
            <a href="/registro" class="link-registro">Regístrate aquí</a>
        </p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
