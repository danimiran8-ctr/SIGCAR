<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Usuario — SIGCAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f4f6f9; }
        .form-card { background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); max-width: 600px; margin: 40px auto; }
        .form-label { font-weight: 600; font-size: 0.88rem; color: #444; }
        .form-control, .form-select { border: 1.5px solid #e0e0e0; border-radius: 10px; padding: 11px 16px; }
        .form-control:focus, .form-select:focus { border-color: #f5c518; box-shadow: 0 0 0 3px rgba(245,197,24,0.15); }
        .btn-guardar { background: #f5c518; color: #1a1a2e; font-weight: 700; border: none; border-radius: 10px; padding: 12px 28px; }
        .btn-guardar:hover { background: #e0b015; }
        .page-header { background: #1a1a2e; color: #fff; padding: 16px 28px; margin-bottom: 0; }
        .page-header span { color: #f5c518; font-weight: 800; }
    </style>
</head>
<body>
    <div class="page-header d-flex align-items-center justify-content-between">
        <div style="font-size:1.1rem;font-weight:700;">
            <i class="bi bi-car-front-fill me-2"></i><span>SIGCAR</span> — Formulario de Usuario
        </div>
        <a href="/usuarios/lista" class="btn btn-sm btn-outline-warning fw-600">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>

    <div class="container">
        <div class="form-card">
            <h5 class="fw-700 mb-4" style="color:#1a1a2e;">
                <i class="bi bi-person-plus me-2" style="color:#f5c518;"></i>Datos del Usuario
            </h5>

            <div id="mensajeForm" style="display:none;" class="mb-3"></div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombres</label>
                    <input type="text" id="nombres" class="form-control" placeholder="Nombres completos" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Apellidos</label>
                    <input type="text" id="apellidos" class="form-control" placeholder="Apellidos completos" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" id="correo" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Teléfono</label>
                    <input type="text" id="telefono" class="form-control" placeholder="300 000 0000">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Rol</label>
                    <select id="rol" class="form-select">
                        <option value="ADMINISTRADOR">Administrador</option>
                        <option value="AGENTE">Agente</option>
                        <option value="CLIENTE" selected>Cliente</option>
                        <option value="MECANICO">Mecánico</option>
                        <option value="AUDITOR">Auditor</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="col-12 d-flex gap-2 mt-2">
                    <button class="btn-guardar" onclick="guardar()">
                        <i class="bi bi-check-lg me-2"></i>Guardar Usuario
                    </button>
                    <a href="/usuarios/lista" class="btn btn-light border fw-600 px-4">Cancelar</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        async function guardar() {
            const datos = {
                nombres:   document.getElementById('nombres').value,
                apellidos: document.getElementById('apellidos').value,
                correo:    document.getElementById('correo').value,
                telefono:  document.getElementById('telefono').value,
                rol:       document.getElementById('rol').value,
                password:  document.getElementById('password').value,
            };

            const msg = document.getElementById('mensajeForm');
            msg.style.display = 'block';

            try {
                const token = getCookie('jwt_token');
                const res = await fetch('/api/auth/registro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(datos)
                });

                if (res.ok) {
                    msg.className = 'alert alert-success rounded-3';
                    msg.innerHTML = '✅ Usuario creado correctamente. Redirigiendo...';
                    setTimeout(() => window.location.href = '/usuarios/lista', 1800);
                } else {
                    const error = await res.text();
                    msg.className = 'alert alert-danger rounded-3';
                    msg.innerHTML = '❌ ' + error;
                }
            } catch (e) {
                msg.className = 'alert alert-danger rounded-3';
                msg.innerHTML = '❌ Error de conexión';
            }
        }
    </script>
</body>
</html>
